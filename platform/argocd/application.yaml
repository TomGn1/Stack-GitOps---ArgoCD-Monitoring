apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
      repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "9.4.17"
      helm:
        values: |
          global:
            image:
              tag: v3.3.6
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
